name: FriendsMeeting backend tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: friendsmeeting_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d friendsmeeting_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5433/friendsmeeting_test
      FRIENDSMEETING_TEST_DATABASE_URL: postgresql+psycopg://test:test@127.0.0.1:5433/friendsmeeting_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate syntax
        run: python -m compileall -q app tests migrations

      - name: Apply migrations to isolated test database
        run: python -m alembic upgrade head

      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest tests/ -v
