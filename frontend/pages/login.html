<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | FriendsMeeting</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main>
    <h1>Entrar</h1>

    <form id="login-form">
      <label for="email">E-mail</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        required
      >

      <label for="password">Senha</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Entrar</button>
      <p id="form-message" role="status" aria-live="polite"></p>
    </form>

    <p>Ainda não tem conta? <a href="register.html">Cadastre-se</a></p>
  </main>

  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
